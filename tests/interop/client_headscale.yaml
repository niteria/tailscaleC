# Disposable direct-UDP interoperability lab; never use this as a public server.
# HTTP transports the encrypted Noise control protocol on a private Docker bridge.
server_url: http://headscale:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: ""
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
disable_check_updates: true
noise:
  private_key_path: /var/lib/headscale/noise.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  server:
    enabled: false
  urls: []
  paths: [/etc/headscale/derp.yaml]
  auto_update_enabled: false
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
log:
  level: warn
  format: text
policy:
  mode: file
  path: /etc/headscale/policy.json
dns:
  magic_dns: false
  base_domain: lab.test
  override_local_dns: false
  nameservers:
    global: []
    split: {}
unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0700"
