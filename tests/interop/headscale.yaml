# Test-only configuration for ghcr.io/juanfont/headscale:0.29.5.
# Certificates and state are created by tools/check_headscale_stun.py.
server_url: https://localhost:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: ""
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
disable_check_updates: true
noise:
  private_key_path: /var/lib/headscale/noise.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  server:
    enabled: true
    region_id: 999
    region_code: lab
    region_name: Local Test Lab
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
tls_cert_path: /etc/headscale/cert.pem
tls_key_path: /etc/headscale/key.pem
log:
  level: warn
  format: text
policy:
  mode: file
  path: ""
dns:
  magic_dns: false
  base_domain: lab.test
  override_local_dns: false
  nameservers:
    global: []
    split: {}
unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0700"
